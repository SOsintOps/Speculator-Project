name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    name: Syntax, ShellCheck, tests and config validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax gate, ShellCheck gate and tests
        run: |
          shellcheck --version
          bash tests/run_all.sh

      - name: Validate JSON config files
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            echo "==> jq . $f"
            jq empty "$f" || fail=1
          done < <(find ./config -type f -name '*.json' -print0)
          exit $fail
